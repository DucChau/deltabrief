[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deltabrief"
version = "0.1.0"
description = "Git-powered developer briefing generator with conventional commit classification and hotspot analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Duc Chau", email = "duc.chau@gmail.com"}]
dependencies = [
    "gitpython>=3.1",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
deltabrief = "deltabrief.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["deltabrief"]
